<html lang="zh-CN">

<title>答案之书</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  justify-content: center;
  overflow: hidden;
  position: relative;

  z-index: 0;
  animation: twinkle 8s ease-in-out infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 2rem;
  max-width: 480px;

/* 首页 */
.intro {
  animation: fadeIn 1.5s ease;
}

.intro h1 {
  font-size: 2.2rem;

  letter-spacing: 0.5rem;

.intro p {

.intro .step {
  color: #a08a3a;
  font-size: 0.9rem;
}

.input-area {
  margin-top: 2rem;
}

.input-area input {
  background: transparent;
  border: 1px solid #3a3520;
  border-radius: 8px;
  padding: 0.8rem 1.2rem;
  font-size: 1.5rem;
  color: #c9a84c;
  text-align: center;
  width: 160px;

}

.input-area input::placeholder {
  color: #4a4020;
  font-size: 1rem;
}

.input-area input:focus {
  border-color: #c9a84c;
}

.btn {
  display: inline-block;
  margin-top: 1.5rem;
  padding: 0.8rem 2rem;
  background: transparent;
  border: 1px solid #c9a84c;
  color: #c9a84c;
  font-size: 1rem;
  font-family: inherit;
  letter-spacing: 0.3rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s;
}

.btn:hover {
  background: rgba(201,168,76,0.1);
}

.btn:active {
  transform: scale(0.97);
}

.btn-random {
  margin-top: 1rem;
  padding: 0.6rem 1.5rem;
  font-size: 0.85rem;
  border-color: #5a5030;
  color: #8a7a4a;
}

/* 答案页 */
.answer-page {
  display: none;
  animation: bookFlip 0.8s ease;
}

.answer-page.show {
  display: block;
}

@keyframes bookFlip {
  0% { transform: rotateY(90deg); opacity: 0; }
  50% { transform: rotateY(-5deg); opacity: 0.8; }
  100% { transform: rotateY(0deg); opacity: 1; }
}

.page-number {
  font-size: 0.85rem;
  color: #5a5030;
  margin-bottom: 1.5rem;
  letter-spacing: 0.2rem;
}

.answer-text {
  font-size: 2rem;
  line-height: 1.8;
  margin: 2rem 0;
  text-shadow: 0 0 30px rgba(201,168,76,0.2);
  min-height: 4rem;
}

.divider {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, #c9a84c, transparent);
  margin: 1.5rem auto;
}

.actions {
  margin-top: 2rem;
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 3rem;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(201,168,76,0.15);
  border: 1px solid #3a3520;
  color: #c9a84c;
  padding: 0.6rem 1.5rem;
  border-radius: 20px;
  font-size: 0.85rem;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 10;
}

.toast.show {
  opacity: 1;
}
</style>

function showPage(num) {
  if (num < 1 || num > 412) {
    showToast('请输入 1–412 之间的数字');
    return;
  }
  const answer = ANSWERS[num - 1];
  document.getElementById('pageNum').textContent = '— 第 ' + num + ' 页 —';
  document.getElementById('answerText').textContent = answer;
  document.getElementById('introPage').style.display = 'none';
  const ap = document.getElementById('answerPage');
  ap.classList.remove('show');
  // Force reflow for animation restart
  void ap.offsetWidth;
  ap.classList.add('show');
  // Update URL
  history.pushState({page: num}, '', '?p=' + num);
}

function goToPage() {
  const input = document.getElementById('pageInput');
  const num = parseInt(input.value);
  if (isNaN(num)) {
    showToast('请输入一个数字');
    return;
  }
  showPage(num);
}

function randomPage() {
  const num = Math.floor(Math.random() * 412) + 1;
  showPage(num);
}

function goHome() {
  document.getElementById('answerPage').classList.remove('show');
  document.getElementById('introPage').style.display = '';
  document.getElementById('pageInput').value = '';
  history.pushState({}, '', window.location.pathname);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Enter key
document.getElementById('pageInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') goToPage();
});

// URL params
const params = new URLSearchParams(window.location.search);
const p = parseInt(params.get('p'));
if (p >= 1 && p <= 412) {
  showPage(p);
}

// Back button
window.addEventListener('popstate', function(e) {
  if (e.state && e.state.page) {
    const num = e.state.page;
    document.getElementById('pageNum').textContent = '— 第 ' + num + ' 页 —';
    document.getElementById('answerText').textContent = ANSWERS[num - 1];
    document.getElementById('introPage').style.display = 'none';
    document.getElementById('answerPage').classList.add('show');
  } else {
    document.getElementById('answerPage').classList.remove('show');
    document.getElementById('introPage').style.display = '';

});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>答案之书 · 输入访问码</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  background: #0a0a0f;
  color: #c9a84c;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* 星空背景 */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(201,168,76,0.4), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(201,168,76,0.3), transparent),
    radial-gradient(1px 1px at 50% 10%, rgba(201,168,76,0.5), transparent),
    radial-gradient(1px 1px at 70% 80%, rgba(201,168,76,0.3), transparent),
    radial-gradient(1px 1px at 90% 40%, rgba(201,168,76,0.4), transparent),
    radial-gradient(1.5px 1.5px at 20% 90%, rgba(201,168,76,0.2), transparent),
    radial-gradient(1.5px 1.5px at 60% 30%, rgba(201,168,76,0.2), transparent),
    radial-gradient(1px 1px at 80% 70%, rgba(201,168,76,0.3), transparent),
    radial-gradient(1px 1px at 40% 50%, rgba(201,168,76,0.2), transparent),
    radial-gradient(1px 1px at 15% 75%, rgba(201,168,76,0.3), transparent);
  z-index: 0;
  animation: twinkle 8s ease-in-out infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 2rem;
  max-width: 420px;
  width: 100%;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.icon {
  font-size: 3rem;
  margin-bottom: 1rem;
}

h1 {
  font-size: 1.6rem;
  font-weight: 400;
  letter-spacing: 0.4rem;
  margin-bottom: 0.8rem;
  text-shadow: 0 0 20px rgba(201,168,76,0.3);
}

.subtitle {
  font-size: 0.85rem;
  color: #6a5a3a;
  margin-bottom: 2rem;
  line-height: 1.8;
}

.input-wrapper {
  position: relative;
  margin-bottom: 1.5rem;
}

.input-wrapper input {
  background: transparent;
  border: 1px solid #3a3520;
  border-radius: 8px;
  padding: 0.8rem 1rem;
  font-size: 1.4rem;
  color: #c9a84c;
  text-align: center;
  width: 100%;
  max-width: 240px;
  outline: none;
  font-family: inherit;
  letter-spacing: 0.3rem;
  text-transform: uppercase;
  transition: border-color 0.3s;
}

.input-wrapper input::placeholder {
  color: #3a3020;
  font-size: 0.95rem;
  letter-spacing: 0.1rem;
}

.input-wrapper input:focus {
  border-color: #c9a84c;
}

.btn {
  display: inline-block;
  padding: 0.7rem 2.5rem;
  background: transparent;
  border: 1px solid #c9a84c;
  color: #c9a84c;
  font-size: 0.95rem;
  font-family: inherit;
  letter-spacing: 0.3rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s;
  -webkit-appearance: none;
}

.btn:hover {
  background: rgba(201,168,76,0.1);
}

.btn:active {
  transform: scale(0.97);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.error {
  color: #a04040;
  font-size: 0.8rem;
  margin-top: 0.8rem;
  min-height: 1.2rem;
  transition: opacity 0.3s;
}

.footer {
  margin-top: 2.5rem;
  font-size: 0.7rem;
  color: #3a3020;
  letter-spacing: 0.1rem;
}
</style>
</head>
<body>

<div class="container">
  <div class="icon">📖</div>
  <h1>答 案 之 书</h1>
  <p class="subtitle">输入你的专属访问码<br>翻开属于你的答案</p>

  <div class="input-wrapper">
    <input type="text" id="codeInput" maxlength="6" placeholder="输入访问码" autocomplete="off" autocorrect="off" autocapitalize="characters">
  </div>

  <button class="btn" id="submitBtn" onclick="verifyCode()">翻 开</button>

  <div class="error" id="errorMsg"></div>

  <div class="footer">THE BOOK OF ANSWERS</div>
</div>

<script>
const input = document.getElementById('codeInput');
const btn = document.getElementById('submitBtn');
const errorEl = document.getElementById('errorMsg');

// 自动跳过大写转换，保持输入体验
input.addEventListener('input', function() {
  errorEl.textContent = '';
  // 只允许字母和数字
  this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
});

// Enter 提交
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyCode();
});

async function verifyCode() {
  const code = input.value.trim().toUpperCase();
  if (!code) {
    errorEl.textContent = '请输入访问码';
    return;
  }
  if (code.length < 4) {
    errorEl.textContent = '访问码至少4位';
    return;
  }

  btn.disabled = true;
  btn.textContent = '验证中…';
  errorEl.textContent = '';

  try {
    const resp = await fetch('/api/verify?code=' + encodeURIComponent(code));
    const data = await resp.json();
    if (data.valid) {
      // 存入 localStorage，跳转
      localStorage.setItem('ab_code', code);
      window.location.href = '/book.html?code=' + encodeURIComponent(code);
    } else {
      errorEl.textContent = data.message || '访问码无效';
      btn.disabled = false;
      btn.textContent = '翻 开';
    }
  } catch (err) {
    errorEl.textContent = '网络错误，请重试';
    btn.disabled = false;
    btn.textContent = '翻 开';
  }
}

// 聚焦输入框
input.focus();
</script>

</body>
</html>

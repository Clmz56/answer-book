function showPage(num) {
  if (num < 1 || num > 412) {
    showToast('请输入 1–412 之间的数字');
    return;
  }
  const answer = ANSWERS[num - 1];
  document.getElementById('pageNum').textContent = '— 第 ' + num + ' 页 —';
  document.getElementById('answerText').textContent = answer;
  document.getElementById('introPage').style.display = 'none';
  const ap = document.getElementById('answerPage');
  ap.classList.remove('show');
  void ap.offsetWidth;
  ap.classList.add('show');
  history.pushState({page: num}, '', '?p=' + num);
}

function goToPage() {
  const input = document.getElementById('pageInput');
  const num = parseInt(input.value);
  if (isNaN(num)) return showToast('请输入一个数字');
  showPage(num);
}

function randomPage() {
  showPage(Math.floor(Math.random() * 412) + 1);
}

function goHome() {
  document.getElementById('answerPage').classList.remove('show');
  document.getElementById('introPage').style.display = '';
  document.getElementById('pageInput').value = '';
  history.pushState({}, '', window.location.pathname);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

document.getElementById('pageInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') goToPage();
});

const params = new URLSearchParams(window.location.search);
var p = parseInt(params.get('p'));
if (p >= 1 && p <= 412) showPage(p);

window.addEventListener('popstate', function(e) {
  if (e.state && e.state.page) {
    document.getElementById('pageNum').textContent = '— 第 ' + e.state.page + ' 页 —';
    document.getElementById('answerText').textContent = ANSWERS[e.state.page - 1];
    document.getElementById('introPage').style.display = 'none';
    document.getElementById('answerPage').classList.add('show');
  } else {
    document.getElementById('answerPage').classList.remove('show');
    document.getElementById('introPage').style.display = '';

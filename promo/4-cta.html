<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: #3a2c1a;
  font-family: "Noto Serif SC", "Songti SC", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  color: #FFFFFF;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  z-index: 0;
}
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 0 80px;
}

.quote-mark {
  font-size: 140px;
  color: rgba(255,255,255,0.1);
  line-height: 1;
  margin-bottom: -20px;
}

.big-answer {
  font-size: 52px;
  font-weight: 700;
  line-height: 1.7;
  margin-bottom: 50px;
  letter-spacing: 4px;
}

.divider {
  width: 160px;
  height: 2px;
  background: rgba(255,255,255,0.2);
  margin: 0 auto 50px;
  position: relative;
}

.divider::before {
  content: '✦';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.3);
  font-size: 18px;
  background: #3a2c1a;
  padding: 0 20px;
}

.sub-text {
  font-size: 26px;
  color: rgba(255,255,255,0.5);
  line-height: 2.2;
  margin-bottom: 70px;
  letter-spacing: 2px;
}

.cta-box {
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 16px;
  padding: 50px 70px;
  display: inline-block;
  background: rgba(0,0,0,0.15);
}

.cta-title {
  font-size: 40px;
  font-weight: 900;
  letter-spacing: 10px;
  margin-bottom: 24px;
}

.cta-desc {
  font-size: 22px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  line-height: 1.8;
}

.cta-price {
  margin-top: 30px;
  font-size: 56px;
  font-weight: 900;
}

.cta-price span {
  font-size: 24px;
  color: rgba(255,255,255,0.4);
  font-weight: 400;
}

.bottom-text {
  position: absolute;
  bottom: 80px;
  font-size: 20px;
  color: rgba(255,255,255,0.15);
  letter-spacing: 6px;
  z-index: 1;
}
</style>
</head>
<body>

<div class="content">
  <div class="quote-mark">"</div>
  <div class="big-answer">当你不知道怎么做的时候<br>翻开答案之书</div>
  <div class="divider"></div>
  <div class="sub-text">
    不是书给了你答案<br>
    而是你心里已经有了答案<br>
    只是它帮你说了出来
  </div>

  <div class="cta-box">
    <div class="cta-title">答案之书</div>
    <div class="cta-desc">
      412页人生指引 · 手机随时翻阅<br>
      每次翻开 都有新的答案
    </div>
    <div class="cta-price">¥1 <span>/ 次</span></div>
  </div>
</div>

<div class="bottom-text">THE BOOK OF ANSWERS</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: #3a2c1a;
  font-family: "Noto Serif SC", "Songti SC", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  color: #FFFFFF;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  z-index: 0;
}
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  z-index: 0;
}

.ornament-top {
  position: relative;
  z-index: 1;
  font-size: 24px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 16px;
  margin-bottom: 50px;
}

h2 {
  position: relative;
  z-index: 1;
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 16px;
  margin-bottom: 80px;
}

.steps {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 50px;
  padding: 0 100px;
  width: 100%;
}

.step {
  display: flex;
  align-items: flex-start;
  gap: 36px;
}

.step-num {
  width: 72px;
  height: 72px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
  flex-shrink: 0;
  color: #FFFFFF;
}

.step-content {
  flex: 1;
  padding-top: 6px;
}

.step-title {
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: 4px;
}

.step-desc {
  font-size: 24px;
  color: rgba(255,255,255,0.5);
  line-height: 1.7;
  letter-spacing: 1px;
}

.divider {
  position: relative;
  z-index: 1;
  width: 160px;
  height: 2px;
  background: rgba(255,255,255,0.2);
  margin: 70px auto 50px;
}

.phone-mockup {
  position: relative;
  z-index: 1;
  width: 300px;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 30px 24px;
  text-align: center;
}

.phone-label {
  font-size: 16px;
  color: rgba(255,255,255,0.3);
  margin-bottom: 12px;
}

.phone-answer {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 10px;
}

.phone-page {
  font-size: 14px;
  color: rgba(255,255,255,0.25);
}

.bottom-text {
  position: absolute;
  bottom: 80px;
  font-size: 20px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 6px;
  z-index: 1;
}
</style>
</head>
<body>

<div class="ornament-top">✦ ✦ ✦</div>
<h2>如 何 使 用</h2>

<div class="steps">
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-content">
      <div class="step-title">心中默念问题</div>
      <div class="step-desc">闭上眼睛 专注10秒<br>想一个你最近困惑的事</div>
    </div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-content">
      <div class="step-title">输入一个数字</div>
      <div class="step-desc">凭直觉输入1–412之间<br>任意数字 或随机翻页</div>
    </div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-content">
      <div class="step-title">翻开答案</div>
      <div class="step-desc">属于你的答案即刻呈现<br>用心感受 答案自来</div>
    </div>
  </div>
</div>

<div class="divider"></div>

<div class="phone-mockup">
  <div class="phone-answer">翻开属于你的答案</div>
  <div class="phone-page">✦ ✦ ✦</div>
</div>

<div class="bottom-text">简单三步 获得指引</div>
</body>
</html>

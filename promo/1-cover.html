<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: #3a2c1a;
  font-family: "Noto Serif SC", "Songti SC", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* 纸张纹理 */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  z-index: 0;
}

/* 暗角 */
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 0 80px;
}

/* 装饰线顶 */
.ornament-top {
  font-size: 32px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 20px;
  margin-bottom: 60px;
}

/* 主标题 - 超大白字 */
h1 {
  font-size: 120px;
  font-weight: 900;
  color: #FFFFFF;
  letter-spacing: 20px;
  text-shadow: 0 4px 8px rgba(0,0,0,0.3);
  margin-bottom: 30px;
  line-height: 1.2;
}

/* 英文副标题 */
.en-title {
  font-size: 28px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 12px;
  margin-bottom: 60px;
  font-weight: 400;
}

/* 分隔线 */
.divider {
  width: 200px;
  height: 2px;
  background: rgba(255,255,255,0.25);
  margin: 0 auto 60px;
  position: relative;
}

.divider::before {
  content: '✦';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.4);
  font-size: 20px;
  background: #3a2c1a;
  padding: 0 20px;
}

/* 副标题 */
.tagline {
  font-size: 36px;
  color: #FFFFFF;
  letter-spacing: 6px;
  line-height: 2;
  margin-bottom: 80px;
  font-weight: 400;
}

.tagline .highlight {
  font-weight: 900;
  font-size: 42px;
}

/* 底部描述 */
.desc {
  font-size: 22px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 3px;
  line-height: 2;
}

/* 底部装饰 */
.ornament-bottom {
  position: absolute;
  bottom: 100px;
  font-size: 24px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 16px;
  z-index: 1;
}
</style>
</head>
<body>

<div class="content">
  <div class="ornament-top">✦ ✦ ✦</div>

  <h1>答案之书</h1>
  <div class="en-title">THE BOOK OF ANSWERS</div>

  <div class="divider"></div>

  <div class="tagline">
    心中有惑 翻开即解<br>
    <span class="highlight">412</span>页人生答案 随时指引
  </div>

  <div class="desc">
    默念你的问题 专注10秒<br>
    输入一个数字 翻开属于你的答案
  </div>
</div>

<div class="ornament-bottom">✦ ✦ ✦</div>
</body>
</html>
